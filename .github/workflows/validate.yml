name: Validate server

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository
        run: ./scripts/validate-repository.sh

      - name: Run tests
        run: |
          python -m pip install -r server/requirements.txt pytest pytest-cov
          pytest -q \
            --cov=server/app/providers \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=85 \
            tests

  postgres-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run isolated PostgreSQL integration tests
        run: ./scripts/test-postgres.sh

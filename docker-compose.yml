services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-motorsports_events}
      POSTGRES_USER: ${POSTGRES_USER:-mse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mse} -d ${POSTGRES_DB:-motorsports_events}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://mse:change-me@postgres:5432/motorsports_events}
      API_PORT: 3001
      NODE_ENV: development
    ports:
      - "${API_HOST_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-motorsports_events}
      POSTGRES_USER: ${POSTGRES_USER:-mse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me}
      PGHOST: postgres
      PGPORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./infra/postgres/migrations:/migrations:ro
    command: ["sh", "/migrations/migrate.sh", "up"]
    restart: "no"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

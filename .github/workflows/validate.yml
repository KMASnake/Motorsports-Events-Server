name: Validate server

on:
  workflow_dispatch:
  push:
    paths:
      - "server/**"
      - "tests/test_*.py"
      - "tests/fixtures/**"
      - "scripts/validate-repository.sh"
      - "scripts/test-postgres.sh"
      - "scripts/build-release.sh"
      - "docker-compose.test.yml"
      - ".coveragerc"
      - "pytest.ini"
      - "VERSION"
      - "BUILD"
      - "MILESTONE"
  pull_request:
    paths:
      - "server/**"
      - "tests/test_*.py"
      - "tests/fixtures/**"
      - "scripts/validate-repository.sh"
      - "scripts/test-postgres.sh"
      - "scripts/build-release.sh"
      - "docker-compose.test.yml"
      - ".coveragerc"
      - "pytest.ini"
      - "VERSION"
      - "BUILD"
      - "MILESTONE"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository
        run: ./scripts/validate-repository.sh

      - name: Run tests
        run: |
          python -m pip install -r server/requirements.txt pytest pytest-cov
          pytest -q \
            --cov=server/app/providers \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=85 \
            tests

  postgres-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run isolated PostgreSQL integration tests
        run: ./scripts/test-postgres.sh

  release-artifact:
    needs: [validate, postgres-integration]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build release archive
        run: ./scripts/build-release.sh

      - name: Verify release checksum
        run: |
          cd dist
          sha256sum -c \
            "motorsports-events-server-$(cat ../VERSION).zip.sha256"

      - name: Upload release archive and checksum
        uses: actions/upload-artifact@v4
        with:
          name: motorsports-events-server-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 14

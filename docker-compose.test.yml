name: motorsports-events-integration-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: integration
      POSTGRES_PASSWORD: integration-password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integration -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
    environment:
      PROJECT_NAME: Integration tests
      DATABASE_URL: postgresql+psycopg://integration:integration-password@postgres:5432/postgres
      TEST_DATABASE_URL: postgresql+psycopg://integration:integration-password@postgres:5432/postgres
      ADMIN_API_KEY: integration-admin-key
      PUBLIC_API_KEY: integration-public-key
    depends_on:
      postgres:
        condition: service_healthy

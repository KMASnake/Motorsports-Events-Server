name: Validate server

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository
        run: ./scripts/validate-repository.sh

      - name: Run tests
        run: |
          python -m pip install pytest
          pytest -q tests

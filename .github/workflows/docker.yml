name: Docker build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/**'
      - 'docker-compose.yml'
  push:
    branches:
      - codex/lot-4.2-complete
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package*.json'
      - 'docker-compose.yml'
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose build

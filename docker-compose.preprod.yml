services:
  postgres:
    environment:
      TZ: UTC
      PGTZ: UTC
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    restart: unless-stopped

  api:
    environment:
      NODE_ENV: production
      TZ: UTC
      ADMIN_WEB_ORIGIN: https://preprod.motorsports-events.fr
      CORS_ALLOWED_ORIGINS: https://preprod.motorsports-events.fr
    ports: !override
      - "127.0.0.1:${API_HOST_PORT:-3001}:3001"
    restart: unless-stopped

  worker:
    environment:
      NODE_ENV: production
      TZ: UTC
    restart: unless-stopped

  web:
    build:
      args:
        VITE_API_URL: ""
    environment:
      TZ: UTC
    ports: !override
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    restart: unless-stopped

  migrate:
    environment:
      TZ: UTC
      PGTZ: UTC

volumes:
  postgres_data:
    name: ${PREPROD_POSTGRES_VOLUME:-mse_preprod_postgres_data}
